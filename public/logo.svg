<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <!-- Main connecting line -->
  <path d="M20,50 h280" stroke="#7c3aed" stroke-width="1" opacity="0.2"/>
  
  <!-- Main text elements -->
  <text font-family="Arial" font-weight="bold" font-size="42">
    <tspan x="20" y="60" fill="#1f2937">voc</tspan>
    <tspan x="110" y="60" fill="#4c1d95">abu</tspan>
    <tspan x="210" y="60" fill="#7c3aed">lary</tspan>
  </text>

  <!-- Notification dot -->
  <circle cx="320" cy="45" r="12" fill="#7c3aed">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtitle -->
  <text x="110" y="85" font-family="Arial" font-size="16" fill="#6b7280">interval learning</text>

  <!-- Optional: Small connecting dots -->
  <circle cx="95" cy="50" r="3" fill="#7c3aed" opacity="0.4"/>
  <circle cx="195" cy="50" r="3" fill="#7c3aed" opacity="0.4"/>
</svg>